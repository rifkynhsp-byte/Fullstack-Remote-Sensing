# Quarto book project for the English edition.
#
# en/ and id/ are two independent Quarto projects rather than two profiles of
# one project. Quarto requires a book's home page to be index.qmd at the
# project root, and there is only one root per project, so a single project
# cannot host two home pages.
#
# The format block below is duplicated in the other language's _quarto.yml.
# That duplication is deliberate: sharing it through metadata-files across a
# parent directory works until it does not, and a broken build costs more than
# forty lines of repeated YAML.
#
# Shared assets (theme.scss, theme-dark.scss, styles.css, references.bib) are
# copied in here by tools/build_site.sh. Do not edit the copies; edit the
# originals in the repository root.

project:
  type: book
  output-dir: _book

lang: en

book:
  title: "Planetary-Scale Cloud GIS"
  subtitle: "Earth Engine and GeoAI, taught the way it is actually practised"
  author:
    - name: "Rifky Nauval Hendrawan"
      affiliation: "Geospatial Data Science, Remote Sensing and Environmental Analytics"
  date: today
  date-format: "MMMM YYYY"
  search: true
  reader-mode: true
  page-navigation: true
  downloads: [pdf]
  favicon: favicon.svg
  navbar:
    right:
      - text: "Bahasa Indonesia"
        href: ../id/index.html
  sidebar:
    style: docked
    collapse-level: 1
    border: true
    tools:
      - icon: translate
        text: "Bahasa Indonesia"
        href: ../id/index.html
  chapters:
    - index.qmd
    - 00-different.qmd
    - part: "Part I: Foundations, Purpose and Physics"
      chapters:
        - 01-why-monitor.qmd
        - 02-physics.qmd
        - 03-sensors.qmd
        - 04-paradigm-shift.qmd
    - part: "Part II: The Platform"
      chapters:
        - 05-ecosystem.qmd
        - 06-javascript.qmd
        - 07-server-side.qmd
    - part: "Part III: Analysis Ready Data"
      chapters:
        - 08-optical-ingestion.qmd
        - 09-cloud-masking.qmd
        - 10-sar-fusion.qmd
        - 11-terrain.qmd
    - part: "Part IV: Feature Engineering"
      chapters:
        - 12-band-math.qmd
        - 13-visualisation.qmd
        - 14-texture.qmd
        - 15-sampling.qmd
    - part: "Part V: Machine Learning"
      chapters:
        - 16-supervised.qmd
        - 17-accuracy.qmd
        - 18-obia.qmd
    - part: "Part VI: GeoAI and Impact"
      chapters:
        - 19-embeddings.qmd
        - 20-regression-biomass.qmd
        - 21-time-series.qmd
        - 22-vector-geoai.qmd
        - 23-apps-mrv.qmd
    - dashboard.qmd
    - references.qmd
  appendices:
    - appendix-a-setup.qmd
    - appendix-b-errors.qmd
    - appendix-c-style.qmd
    - appendix-d-glossary.qmd
    - instructor.qmd

bibliography: references.bib
csl: https://www.zotero.org/styles/apa

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    code-line-numbers: true
    code-annotations: hover
    code-tools: false
    highlight-style: github
    callout-appearance: simple
    fig-cap-location: bottom
    tbl-cap-location: top
    link-external-newwindow: true
    link-external-icon: false
    include-in-header:
      - text: |
          <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
          <link rel="stylesheet" href="../lms/lms.css">
    include-after-body:
      - text: |
          <script src="../lms/config.js"></script>
          <script src="../lms/lms.js"></script>

  pdf:
    documentclass: scrbook
    classoption: [oneside]
    papersize: a4
    geometry: [inner=3cm, outer=3cm, top=2.5cm, bottom=2.5cm]
    fontsize: 10pt
    colorlinks: true
    linkcolor: teal
    urlcolor: teal
    citecolor: teal
    code-annotations: below
    code-block-bg: "#f7f7f9"
    code-block-border-left: "#1b8a6b"
    highlight-style: github

execute:
  echo: true
  freeze: auto
