name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Structural validation runs on its own, before anything is installed.
  # It takes about ten seconds and catches the errors that would otherwise
  # surface several minutes into a Quarto render, deep in a log.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The checks need PyYAML only. Installing the full render dependency
      # set here would add two minutes to a job whose whole point is to fail
      # in ten seconds.
      - run: pip install pyyaml

      - name: Generate code listings
        run: python3 tools/build_snippets.py

      - name: Pre-flight checks
        run: python3 tools/check_project.py

  build:
    needs: check
    runs-on: ubuntu-latest

    # A render should take three to six minutes. Anything approaching twenty
    # is hung rather than slow, and a hung job silently burns the whole
    # billing budget on one chapter. Fail fast instead.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39
          # tinytex is not installed because PDF output is disabled. See the
          # note at the bottom of en/_quarto.yml for what to restore if you
          # want PDF downloads back.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The chapters execute Python when they render, so these are build
      # dependencies exactly as Quarto is. Without them the render fails on
      # an import inside a kernel, several minutes in.
      - name: Install Python render dependencies
        run: pip install -r requirements.txt

      # Executed chunks are cached by Quarto in _freeze/. Restoring that cache
      # means a commit touching only prose re-executes nothing, which is most
      # commits. The key includes the chunk sources so a changed computation
      # invalidates it.
      - name: Restore executed chunk cache
        uses: actions/cache@v4
        with:
          path: |
            en/_freeze
            id/_freeze
          key: freeze-${{ hashFiles('booklib.py', 'en/*.qmd', 'id/*.qmd', 'requirements.txt') }}
          restore-keys: |
            freeze-

      # One command builds everything: generates code listings, copies shared
      # assets into each language project, renders both books, and assembles
      # docs/. Keeping the logic in a script rather than in YAML means the
      # local build and the CI build cannot drift apart.
      - name: Build site
        run: bash tools/build_site.sh

      - name: Show what was built
        run: |
          echo "Top level:"
          ls -la docs
          echo
          echo "Page counts:"
          echo "  en: $(find docs/en -name '*.html' | wc -l) pages"
          echo "  id: $(find docs/id -name '*.html' | wc -l) pages"
          echo
          echo "Platform assets that both editions load from ../lms/:"
          ls -1 docs/lms
          echo
          echo "Executed figures and tables:"
          echo "  plotly charts: $(grep -rl 'plotly-graph-div' docs/en docs/id | wc -l) page(s)"
          echo "  runnable cells: $(grep -ro 'class=\"py-live\"' docs/en docs/id | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
