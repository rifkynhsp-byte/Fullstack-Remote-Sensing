name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39
          tinytex: true          # needed for the PDF download button

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render English
        run: quarto render --profile en

      - name: Render Bahasa Indonesia
        run: quarto render --profile id

      - name: Assemble site
        run: |
          mkdir -p docs docs/lms
          cp landing/index.html docs/index.html
          cp -r landing/assets docs/assets
          cp lms/lms.js lms/lms.css lms/config.js docs/lms/
          touch docs/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
