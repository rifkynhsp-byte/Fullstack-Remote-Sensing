name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39
          tinytex: true          # needed for the PDF download button

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # One command builds everything: generates code listings, copies shared
      # assets into each language project, renders both books, and assembles
      # docs/. Keeping the logic in a script rather than in YAML means the
      # local build and the CI build cannot drift apart.
      - name: Build site
        run: bash tools/build_site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
